<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF 圖庫與檔案複製器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .icon-card {
            width: 56px;
            height: 56px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: #2d2d2d;
            padding: 4px;
            transition: transform 0.1s ease, border-color 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .icon-card:hover {
            transform: scale(1.15);
            border-color: #4da6ff;
        }
        /* 提示框加入多種狀態顏色 */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
            text-align: center;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <h2 style="color: red;">電腦自行右鍵複製，手機長案複製</h2>
    <h2>點擊圖示即可複製檔案（若瀏覽器阻擋則自動下載）</h2>
    <div class="gallery" id="gallery"></div>
    <div id="toast">已複製！</div>

    <script>
        // 你的 GIF 檔名清單
        const gifs = [
            "p628059057.gif", "p628059059.gif", "p628059060.gif", "p628059061.gif", "p628059062.gif",
            "p628059063.gif", "p628059064.gif", "p628059065.gif", "p628059067.gif", "p628059068.gif",
            "p628059071.gif", "p628059072.gif", "p628059073.gif", "p628059074.gif", "p628059075.gif",
            "p628059076.gif", "p628059077.gif", "p628059079.gif", "p628059080.gif", "p628059081.gif",
            "p628059083.gif", "p628059087.gif", "p628059088.gif", "p628059091.gif", "p628059092.gif",
            "p628059095.gif", "p628059098.gif", "p628059100.gif", "p628059101.gif", "p628059105.gif",
            "p628059106.gif", "p628059108.gif", "p628059109.gif", "p628059113.gif", "p628059114.gif",
            "p628059117.gif", "p628059118.gif", "p628059121.gif", "p628059123.gif", "p628059129.gif",
            "p628059130.gif", "p628059131.gif", "p628059132.gif", "p628059134.gif", "p628059135.gif",
            "p628059136.gif", "p628059137.gif", "p628059138.gif", "p628059139.gif", "p628059140.gif",
            "p628059141.gif", "p628059142.gif", "p628059143.gif", "p628059144.gif", "p628059145.gif",
            "p628059146.gif", "p628059149.gif", "p628059150.gif", "p628059151.gif", "p628059152.gif",
            "p628059153.gif", "p628059154.gif", "p628059156.gif", "p628059157.gif", "p628059159.gif",
            "p628059160.gif"
        ];

        const gallery = document.getElementById('gallery');
        const toast = document.getElementById('toast');
        let toastTimeout;

        gifs.forEach(filename => {
            const img = document.createElement('img');
            img.src = filename;
            img.alt = filename;
            img.title = filename;
            img.className = 'icon-card';

            img.addEventListener('click', async () => {
                try {
                    // 1. 抓取圖片並轉換成二進位 Blob 實體檔案格式
                    const response = await fetch(filename);
                    const blob = await response.blob();

                    try {
                        // 2. 嘗試將 GIF 實體檔案寫入剪貼簿
                        const item = new ClipboardItem({ [blob.type]: blob });
                        await navigator.clipboard.write([item]);
                        showToast('✅ 已複製 GIF 檔案！請在 Discord 直接貼上', 'success');
                    } catch (clipboardError) {
                        // 3. 備用方案：若瀏覽器阻擋寫入 GIF，則觸發自動下載
                        console.warn('瀏覽器不支援直接寫入動態 GIF 到剪貼簿，觸發自動下載。', clipboardError);
                        
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        showToast('⚠️ 瀏覽器限制複製，已為您秒速下載！請直接拖曳到 Discord', 'warning');
                    }
                } catch (err) {
                    console.error('獲取檔案失敗:', err);
                    showToast('❌ 處理圖片失敗', 'error');
                }
            });

            gallery.appendChild(img);
        });

        // 動態顯示與更換提示框顏色的函數
        function showToast(message, type = 'success') {
            toast.textContent = message;
            
            // 根據不同狀況調整顏色
            toast.style.backgroundColor = type === 'warning' ? '#ffcc00' : (type === 'error' ? '#ff4d4d' : '#4da6ff');
            toast.style.color = type === 'warning' ? '#121212' : (type === 'error' ? '#ffffff' : '#121212');
            
            clearTimeout(toastTimeout);
            toast.classList.add('show');
            // 將顯示時間拉長到 3 秒，方便看清楚提示文字
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
